name: Backend CI

on:
  push:
    branches: [ main, copilot/** ]
    paths:
      - 'backend-go/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend-go/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Build Go Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.22'
        
    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('backend-go/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Install dependencies
      working-directory: ./backend-go
      run: go mod download
      
    - name: Verify dependencies
      working-directory: ./backend-go
      run: go mod verify
      
    - name: Build
      working-directory: ./backend-go
      run: go build -v -o server ./cmd/server
      
    - name: Check binary
      working-directory: ./backend-go
      run: |
        ls -lh server
        file server
        
    - name: Upload binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ghostwriter-backend
        path: backend-go/server
        retention-days: 7

  test:
    name: Test Go Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.22'
        
    - name: Run tests
      working-directory: ./backend-go
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
    - name: Upload coverage artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: backend-coverage
        path: backend-go/coverage.txt
        retention-days: 7
        
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.22'
        
    - name: Install pinned golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

    - name: Run golangci-lint
      working-directory: ./backend-go
      run: golangci-lint run --timeout=5m
        
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Build Docker image
      working-directory: ./backend-go
      run: docker build -t ghostwriter-backend:test .
      
    - name: Test Docker image
      run: |
        docker images | grep ghostwriter-backend
