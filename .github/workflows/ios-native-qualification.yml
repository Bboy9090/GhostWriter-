name: GhostWriter iOS Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native-qualification.yml'
  push:
    branches: [main, "release/ios-project-qualification-20261031"]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate
      - name: Build iOS simulator app
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild             -project GhostWriter.xcodeproj             -scheme GhostWriter             -sdk iphonesimulator             -configuration Release             CODE_SIGNING_ALLOWED=NO             build
